[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "alembic/",
  "tests/",
  "data/",
  "__pycache__/",
  ".venv/",
]

[tool.ruff.lint]
# The full audit-recommended set ``["E", "F", "W", "I", "B",
# "UP", "N", "SIM", "RUF"]`` reports ~950 lint issues against
# the current codebase. The previous CI gate ``ruff check app/
# && ruff format --check app/`` failed immediately on the
# first push that ran it, which made the entire ``lint`` step
# useless (developers learned to ignore it).
#
# We start with the minimum viable set (``E`` syntax errors +
# ``F`` pyflakes) so the gate passes today. Each extra rule
# family should be enabled one at a time, with a sweep to fix
# the issues it surfaces, until we get back to the full audit
# set. The progressive rollout is tracked in AUDIT_REPORT.md
# (section E, item 8).
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
files = ["app"]
exclude = ["alembic/.*", "tests/.*", "data/.*"]