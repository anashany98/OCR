[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "alembic/",
  "tests/",
  "data/",
  "__pycache__/",
  ".venv/",
]

[tool.ruff.lint]
# L-1: progressively wider rule set. The original
# ``["E", "F"]`` was the minimum-viable set; we now enable
# ``UP`` (pyupgrade: catches deprecated stdlib use like
# ``datetime.utcnow()``), ``B`` (bugbear: catches real bugs
# like mutable defaults and ``is``/``==`` confusion) and
# ``SIM`` (simplify: catches redundant ``if``/``return`` etc.).
# The previous full audit set still reports ~950 issues; we
# add the high-signal rules in ``W`` and ``I`` and rely on
# per-rule ``ignore`` lines for the rest. Each batch should
# land behind a separate PR with a sweep to fix the new
# warnings, so the gate never blocks everyone at once.
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # line length: handled by the formatter
    "B008",   # function call in default argument (FastAPI uses this)
    "UP038",  # isinstance tuple form: low value
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
files = ["app"]
exclude = ["alembic/.*", "tests/.*", "data/.*"]