name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: docuintel
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d docuintel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: docu-intel/backend
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/docuintel
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      JWT_SECRET: ci_jwt_secret_change_me_for_pipeline_only
      ADMIN_PASSWORD: ci_admin_password_change_me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docu-intel/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install --default-timeout=120 --retries=5 -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Install backend dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint backend (ruff)
        run: ruff check app/ && ruff format --check app/
      - name: Type check backend (mypy)
        run: mypy app/
        continue-on-error: true
      - name: Run backend tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=50
      - name: Validate OpenAPI public surface
        run: pytest -m contract -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docu-intel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docu-intel/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend (eslint)
        run: npm run lint
      - name: Check frontend formatting (prettier)
        run: npm run format:check
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  golden-ocr:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: docu-intel/backend
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/docuintel
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      JWT_SECRET: ci_jwt_secret_change_me_for_pipeline_only
      ADMIN_PASSWORD: ci_admin_password_change_me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docu-intel/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install --default-timeout=120 --retries=5 -r requirements.txt
      - name: Run golden OCR regression tests
        run: pytest tests/test_ocr_golden.py -v

  rag-eval:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: docuintel
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d docuintel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: docu-intel/backend
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/docuintel
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      JWT_SECRET: ci_jwt_secret_change_me_for_pipeline_only
      ADMIN_PASSWORD: ci_admin_password_change_me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docu-intel/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install --default-timeout=120 --retries=5 -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Run RAG evaluation tests
        run: pytest tests/test_phase3_ai_search.py -v
