services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: docuintel
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d docuintel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-1}

  # One-shot migration job (MIG-1).
  #
  # Alembic is run here, exactly once per stack start, instead of
  # from every uvicorn replica's CMD. Multiple backend replicas
  # used to race on ``alembic_version`` at boot and a slow migration
  # would crash the healthcheck loop. The migrate service waits
  # for the schema to be at head, exits 0, and the backend / workers
  # declare ``depends_on.migrate.condition:
  # service_completed_successfully`` so they do not start until
  # the schema is current.
  #
  # Re-run manually after a hotfix with:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build:
      context: ./backend
    env_file: ${DOCUINTEL_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/scripts/entrypoint-migrate.sh"]
    restart: "no"
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    volumes:
      - ./backend/scripts:/app/scripts:ro
    networks:
      - internal
    mem_limit: ${MIGRATE_MEM_LIMIT:-512m}
    cpus: ${MIGRATE_CPUS:-1}

  backend:
    build:
      context: ./backend
    env_file: ${DOCUINTEL_ENV_FILE:-.env}
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health'); exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    cpus: ${BACKEND_CPUS:-2}
    networks:
      - internal

  worker-fast:
    build:
      context: ./backend
    env_file: ${DOCUINTEL_ENV_FILE:-.env}
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q text_fast,embeddings,celery --concurrency=${WORKER_FAST_CONCURRENCY:-4}
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: ${WORKER_FAST_MEM_LIMIT:-2g}
    cpus: ${WORKER_FAST_CPUS:-2}
    networks:
      - internal

  worker-maintenance:
    build:
      context: ./backend
    env_file: ${DOCUINTEL_ENV_FILE:-.env}
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q maintenance --concurrency=${WORKER_MAINTENANCE_CONCURRENCY:-1}
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: ${WORKER_MAINTENANCE_MEM_LIMIT:-1g}
    cpus: ${WORKER_MAINTENANCE_CPUS:-1}
    networks:
      - internal

  ocr-worker:
    build:
      context: ./backend
    env_file: ${DOCUINTEL_ENV_FILE:-.env}
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q ocr_heavy --concurrency=${OCR_WORKER_CONCURRENCY:-1}
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: ${OCR_WORKER_MEM_LIMIT:-6g}
    cpus: ${OCR_WORKER_CPUS:-4}
    networks:
      - internal

  watcher:
    build:
      context: ./backend
    env_file: ${DOCUINTEL_ENV_FILE:-.env}
    command: python -m app.ingestion.watcher
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; assert os.path.isdir('/app/data/input')\""]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: ${WATCHER_MEM_LIMIT:-1g}
    cpus: ${WATCHER_CPUS:-1}
    networks:
      - internal

  scheduler:
    build:
      context: ./backend
    env_file: ${DOCUINTEL_ENV_FILE:-.env}
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    mem_limit: ${SCHEDULER_MEM_LIMIT:-512m}
    cpus: ${SCHEDULER_CPUS:-1}
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_ENABLE_TENANT_ADMIN: ${VITE_ENABLE_TENANT_ADMIN:-false}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.0}
        VITE_SENTRY_PROFILES_SAMPLE_RATE: ${VITE_SENTRY_PROFILES_SAMPLE_RATE:-0.0}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - public

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
  public:
