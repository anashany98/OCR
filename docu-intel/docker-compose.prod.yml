services:
  postgres:
    # F7-03: pinned to specific version for reproducibility
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: docuintel
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d docuintel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    # F7-03: pinned to specific version
    image: redis:7.4.2-alpine
    restart: always
    # F7-04: run as non-root
    user: "999:999"
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-1}

  pgbouncer:
    # F7-03: pinned version (already specific)
    image: edoburu/pgbouncer:1.23.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app}@postgres:5432/docuintel
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 300
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    mem_limit: 256m
    cpus: 0.5

  backend:
    build:
      context: ./backend
    env_file: ${DOCUINTEL_ENV_FILE:-.env}
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    # F7-04: drop all capabilities, add only what's needed
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    healthcheck:
      # F7-02: readiness probe checks DB + Redis connectivity
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:8000/healthz'); exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    cpus: ${BACKEND_CPUS:-2}
    networks:
      - internal

  # ─── GPU Workers (OCR + Embeddings) ───────────────────────────────
  # These workers need GPU access for PaddleOCR, PP-Structure, and
  # the sentence-transformers embedding model. One GPU per container.
  worker-ocr-gpu:
    image: docuintel-backend-gpu:latest
    restart: unless-stopped
    environment:
      - C_FORCE_ROOT=true
      - WORKER_NAME=ocr-gpu
      # F4-05: dedicate GPU 0 to OCR
      - CUDA_VISIBLE_DEVICES=${OCR_GPU_DEVICE:-0}
      - NVIDIA_VISIBLE_DEVICES=all
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q ocr_heavy --concurrency=${OCR_WORKER_CONCURRENCY:-1} --hostname=ocr-gpu@%h
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -n ocr-gpu@%h"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: ${OCR_WORKER_MEM_LIMIT:-6g}
    cpus: ${OCR_WORKER_CPUS:-4}
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker-embeddings-gpu:
    image: docuintel-backend-gpu:latest
    restart: unless-stopped
    environment:
      - C_FORCE_ROOT=true
      - WORKER_NAME=embeddings-gpu
      # F4-05: dedicate GPU 1 to embeddings (separate from OCR)
      - CUDA_VISIBLE_DEVICES=${EMBEDDING_GPU_DEVICE:-1}
      - NVIDIA_VISIBLE_DEVICES=all
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q embeddings --concurrency=${EMBEDDING_WORKER_CONCURRENCY:-2} --hostname=embeddings-gpu@%h
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -n embeddings-gpu@%h"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: ${EMBEDDING_WORKER_MEM_LIMIT:-4g}
    cpus: ${EMBEDDING_WORKER_CPUS:-2}
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ─── CPU Workers (text, classification, maintenance) ─────────────
  # These workers handle lightweight tasks that don't need GPU.
  worker-text-cpu:
    build:
      context: ./backend
    env_file: ${DOCUINTEL_ENV_FILE:-.env}
    environment:
      - WORKER_NAME=text-cpu
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q text_fast,celery --concurrency=${WORKER_FAST_CONCURRENCY:-4} --hostname=text-cpu@%h
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -n text-cpu@%h"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: ${WORKER_FAST_MEM_LIMIT:-2g}
    cpus: ${WORKER_FAST_CPUS:-2}
    networks:
      - internal

  worker-maintenance:
    build:
      context: ./backend
    env_file: ${DOCUINTEL_ENV_FILE:-.env}
    environment:
      - WORKER_NAME=maintenance
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q maintenance --concurrency=${WORKER_MAINTENANCE_CONCURRENCY:-1} --hostname=maintenance@%h
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -n maintenance@%h"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: ${WORKER_MAINTENANCE_MEM_LIMIT:-1g}
    cpus: ${WORKER_MAINTENANCE_CPUS:-1}
    networks:
      - internal

  watcher:
    build:
      context: ./backend
    env_file: ${DOCUINTEL_ENV_FILE:-.env}
    command: python -m app.ingestion.watcher
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; assert os.path.isdir('/app/data/input')\""]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: ${WATCHER_MEM_LIMIT:-1g}
    cpus: ${WATCHER_CPUS:-1}
    networks:
      - internal

  scheduler:
    build:
      context: ./backend
    env_file: ${DOCUINTEL_ENV_FILE:-.env}
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    mem_limit: ${SCHEDULER_MEM_LIMIT:-512m}
    cpus: ${SCHEDULER_CPUS:-1}
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_ENABLE_TENANT_ADMIN: ${VITE_ENABLE_TENANT_ADMIN:-false}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.0}
        VITE_SENTRY_PROFILES_SAMPLE_RATE: ${VITE_SENTRY_PROFILES_SAMPLE_RATE:-0.0}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - public

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
  public:
