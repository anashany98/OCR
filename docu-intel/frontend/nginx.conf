server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Security Headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # CSP: allow Google Fonts (Fraunces, Inter, JetBrains Mono are loaded from
  # fonts.googleapis.com / fonts.gstatic.com). 'unsafe-inline' on style-src is
  # required because the app uses both Tailwind injected styles and a few
  # inline styles. To tighten this we'd need nonce-based CSP.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self'; frame-ancestors 'none'" always;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
  gzip_min_length 256;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    set $backend_upstream backend:8000;
    # Allow batch uploads up to ~10x the per-file limit (MAX_UPLOAD_SIZE_MB=200).
    # nginx's default is 1m, which kills every multi-file batch.
    client_max_body_size 2048m;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Proxy timeout settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # Cache static assets (hashed filenames from Vite + Google Fonts files)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
