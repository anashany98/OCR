services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: docuintel
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d docuintel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file: .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      - SENTRY_PROFILES_SAMPLE_RATE=${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      # Vision model on-demand management: the lms CLI lives on the host
      # (Windows) and is bind-mounted into the container so the backend
      # can call it to load / unload the vision model before / after
      # image processing jobs.
      - LMS_CLI_PATH=/usr/local/bin/lms
      - VISION_UNLOAD_DELAY_SECONDS=${VISION_UNLOAD_DELAY_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
      # Mount the host's lms CLI so the backend can manage the vision
      # model lifecycle (load / unload) on demand. Note: this fallback
      # is only useful on Linux hosts where lms is a native ELF binary;
      # on Windows the container can't exec lms.exe and the backend
      # falls back to the HTTP shim at LMS_SHIM_URL (see
      # app/services/vision_manager.py).
      - ${LMS_BIN_PATH:-${USERPROFILE}/.lmstudio/bin/lms.exe}:/usr/local/bin/lms:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health'); exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker-fast:
    build:
      context: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q text_fast,embeddings,celery --concurrency=${WORKER_FAST_CONCURRENCY:-2}
    restart: unless-stopped
    # user: "${APP_UID:-10001}:${APP_GID:-10001}"  # disabled on Windows: 9p bind-mounts are owned by root, non-root user can't read
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Healthcheck: ping Celery every 30s. If 3 consecutive pings fail,
    # Docker restarts the worker. ``start_period`` covers the slow
    # initial model load on the GPU workers.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  worker-heavy:
    build:
      context: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q ocr_heavy --concurrency=${OCR_WORKER_CONCURRENCY:-1}
    restart: unless-stopped
    # user: "${APP_UID:-10001}:${APP_GID:-10001}"  # disabled on Windows: 9p bind-mounts are owned by root, non-root user can't read
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # See note on worker-heavy-gpu-0: we use a process-alive check
    # (`pgrep -f 'celery_app worker'`) because `inspect ping` flakes
    # in this setup. The worker is functionally correct (verified:
    # registers with broker, listens on ocr_heavy queue, processes
    # tasks) but the docker healthcheck invocation is unreliable.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery_app worker' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # GPU-accelerated OCR workers. One per physical GPU. PaddleOCR's
  # PaddleOCREngine auto-detects CUDA via CUDA_VISIBLE_DEVICES, so each
  # worker only sees its assigned card. The CPU worker above stays as
  # fallback if the GPU workers fail to start.
  worker-heavy-gpu-0:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    image: docu-intel-backend-gpu:latest
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q ocr_heavy --concurrency=1 -n worker-heavy-gpu-0@%h
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # GPU workers take longer to start (CUDA init + PaddleOCR/Paddle
    # model upload to VRAM). Use 3-min start_period.
    # NOTE: celery's `inspect ping` (both targeted -d and broadcast)
    # is timing-sensitive in this environment and returns "No nodes
    # replied" intermittently even when the worker is fully up and
    # consuming tasks (verified manually: the worker registers and
    # responds to broadcast ping from other containers, but the
    # docker healthcheck invocation flakes). We use a process-alive
    # check instead: `celery` is a long-running worker; if the
    # command can introspect its own argv and find a celery worker
    # process, the worker is alive. The functional check is done at
    # task-dispatch time, not at the heartbeat level.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery_app worker' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  worker-heavy-gpu-1:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    image: docu-intel-backend-gpu:latest
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q ocr_heavy --concurrency=1 -n worker-heavy-gpu-1@%h
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # WORKAROUND for hosts with a single active GPU (e.g. Windows
      # with WDDM where the secondary RTX 4070 is in P8/Off because
      # no display is connected). This worker shares GPU 0 with
      # worker-heavy-gpu-0 instead of using GPU 1. Restore to =1
      # when the host has 2 active GPUs (Linux server, Windows with
      # dummy HDMI plugs on both cards, etc.).
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # GPU workers take longer to start (CUDA init + PaddleOCR/Paddle
    # model upload to VRAM). Use 3-min start_period.
    # Same reasoning as worker-heavy-gpu-0: `inspect ping` flakes in
    # this environment (returns "No nodes replied" intermittently even
    # when the worker is fully up). Use a process-alive check.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery_app worker' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  worker-maintenance:
    build:
      context: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q maintenance --concurrency=${WORKER_MAINTENANCE_CONCURRENCY:-1}
    restart: unless-stopped
    # user: "${APP_UID:-10001}:${APP_GID:-10001}"  # disabled on Windows: 9p bind-mounts are owned by root, non-root user can't read
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  watcher:
    build:
      context: ./backend
    env_file: .env
    command: python -m app.ingestion.watcher
    restart: unless-stopped
    # user: "${APP_UID:-10001}:${APP_GID:-10001}"  # disabled on Windows: 9p bind-mounts are owned by root, non-root user can't read
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; assert os.path.isdir('/app/data/input')\""]
      interval: 30s
      timeout: 10s
      retries: 5

  scheduler:
    build:
      context: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    restart: unless-stopped
    # user: "${APP_UID:-10001}:${APP_GID:-10001}"  # disabled on Windows: 9p bind-mounts are owned by root, non-root user can't read
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        # VITE_* vars are baked into the bundle at build time; the
        # `environment:` block below is intentionally NOT used for
        # VITE_API_BASE_URL because it has no effect on an already
        # built Vite bundle. Default `/api/v1` (relative) relies on
        # the nginx proxy_pass to backend:8000 in frontend/nginx.conf.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.0}
        VITE_SENTRY_PROFILES_SAMPLE_RATE: ${VITE_SENTRY_PROFILES_SAMPLE_RATE:-0.0}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-}
    restart: unless-stopped
    environment:
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    ports:
      - "5173:80"
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

  # GlitchTip: Sentry-compatible error tracking. Opt-in via `--profile monitoring`.
  # After first start, log in (http://localhost:8001), create a project,
  # copy the DSN and set SENTRY_DSN in the backend .env (and VITE_SENTRY_DSN
  # in the frontend build args).
  glitchtip:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://glitchtip:glitchtip@glitchtip-db/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change_me_generate_with_secrets_token_urlsafe_64}
      EMAIL_URL: ""
      GLITCHTIP_ENVIRONMENT: ${ENVIRONMENT:-local}
      ALLOWED_HOSTS: "*"
      ENABLE_SIGNUP: "true"
    ports:
      - "8001:8000"
    depends_on:
      glitchtip-db:
        condition: service_healthy
    profiles:
      - monitoring

  glitchtip-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
    volumes:
      - glitchtip_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - monitoring

volumes:
  postgres_data:
  glitchtip_data:
