services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 4g
    environment:
      POSTGRES_DB: docuintel
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d docuintel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # H-1: dedicated one-shot migration sidecar. Run with
  #   docker compose run --rm migrate
  # before ``docker compose up -d`` the first time you deploy, and again
  # every time the schema changes. ``restart: on-failure`` keeps it
  # healthy across deploys but a future race between two ``migrate`` runs
  # is no longer possible: this service exits 0 when done and does not
  # stay running. The backend container now boots straight into uvicorn
  # (see backend/Dockerfile) so a multi-replica scale-out no longer races
  # on ``alembic upgrade head``.
  migrate:
    build:
      context: ./backend
    env_file: .env
    command: alembic upgrade head
    restart: on-failure
    user: "0:0"  # migration needs CREATE/ALTER rights; appuser is read-only by design
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    env_file: .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      - SENTRY_PROFILES_SAMPLE_RATE=${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      - LMS_CLI_PATH=/usr/local/bin/lms
      - VISION_UNLOAD_DELAY_SECONDS=${VISION_UNLOAD_DELAY_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
      - ./backend/app:/app/app
      - ${LMS_BIN_PATH:-./scripts/lms_server.py}:/usr/local/bin/lms:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:8000/healthz'); exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker-fast:
    build:
      context: ./backend
    env_file: .env
    environment:
      - WORKER_NAME=worker-fast
      - LMS_SHIM_URL=http://host.docker.internal:1235
      - LMS_CLI_PATH=/usr/local/bin/lms
      - VISION_UNLOAD_DELAY_SECONDS=${VISION_UNLOAD_DELAY_SECONDS:-300}
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q text_fast,embeddings,celery --concurrency=${WORKER_FAST_CONCURRENCY:-2} -n worker-fast@%h
    restart: unless-stopped
    # The entrypoint must start as root to repair nested bind-mount ownership,
    # then drops privileges to appuser before starting Celery.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
      - ./backend/app:/app/app
      - ${LMS_BIN_PATH:-./scripts/lms_server.py}:/usr/local/bin/lms:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d worker-fast@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  worker-heavy:
    build:
      context: ./backend
    env_file: .env
    environment:
      - WORKER_NAME=worker-heavy
      - LMS_SHIM_URL=http://host.docker.internal:1235
      - LMS_CLI_PATH=/usr/local/bin/lms
      - VISION_UNLOAD_DELAY_SECONDS=${VISION_UNLOAD_DELAY_SECONDS:-300}
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q ocr_heavy --concurrency=${WORKER_HEAVY_CPU_CONCURRENCY:-1} --max-tasks-per-child=1 -n worker-heavy@%h
    restart: unless-stopped
    # Recycle the worker process after every task (--max-tasks-per-child=1)
    # to release VRAM/RAM leaked by PaddleOCR/PP-Structure on CPU. Combined
    # with the explicit mem_limit this turns the kernel OOM-killer (which
    # lost jobs mid-flight, 45 SIGKILLs in 6h) into a clean Docker restart.
    # NOTE: 16g was too low — PaddleOCR+PP-Structure on CPU peak ~30g and
    # Docker killed the worker on every heavy doc. 40g gives headroom on a
    # 45g host while still protecting the OS. The --max-tasks-per-child=1
    # ensures the 30g working set is released back between jobs.
    mem_limit: ${WORKER_HEAVY_MEM_LIMIT:-40g}
    # See worker-fast: entrypoint repairs nested ownership then drops privilege.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
      - ./backend/app:/app/app
      - ${LMS_BIN_PATH:-./scripts/lms_server.py}:/usr/local/bin/lms:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # M-5: instead of a ``pgrep`` (which passes even when the worker
    # cannot reach the broker), ask Celery for the registered task
    # names. The worker must be up, registered with Redis, and
    # listening on ``ocr_heavy`` for the check to succeed. A worker
    # that silently died on a broken Redis connection now fails the
    # healthcheck and Docker restarts it.
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app.celery_app inspect ping -t 5 -d worker-heavy@$$(hostname) 2>/dev/null | grep -q pong || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  worker-heavy-cpu-2:
    profiles: ["cpu-fallback"]
    build:
      context: ./backend
    env_file: .env
    environment:
      - WORKER_NAME=worker-heavy-cpu-2
      - LMS_SHIM_URL=http://host.docker.internal:1235
      - LMS_CLI_PATH=/usr/local/bin/lms
      - VISION_UNLOAD_DELAY_SECONDS=${VISION_UNLOAD_DELAY_SECONDS:-300}
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q ocr_heavy --concurrency=${WORKER_HEAVY_CPU_FALLBACK_CONCURRENCY:-1} --max-tasks-per-child=1 -n worker-heavy-cpu-2@%h
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
      - ./backend/app:/app/app
      - ${LMS_BIN_PATH:-./scripts/lms_server.py}:/usr/local/bin/lms:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app.celery_app inspect registered -t 5 -d worker-heavy-cpu-2@$$(hostname) 2>/dev/null | grep -q 'app.workers.tasks' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # GPU-accelerated OCR workers. One per physical GPU. PaddleOCR's
  # PaddleOCREngine auto-detects CUDA via CUDA_VISIBLE_DEVICES, so each
  # worker only sees its assigned card. The CPU worker above stays as
  # fallback if the GPU workers fail to start.
  worker-heavy-gpu-0:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    image: docu-intel-backend-gpu:latest
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q ocr_heavy --concurrency=${WORKER_HEAVY_GPU_CONCURRENCY:-1} --max-tasks-per-child=1 -n worker-heavy-gpu-0@%h
    restart: unless-stopped
    mem_limit: 8g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - WORKER_NAME=worker-heavy-gpu-0
      # Physical GPU 0 is reserved by deploy.resources; inside the
      # container it is always CUDA device 0.
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
      - LMS_SHIM_URL=http://host.docker.internal:1235
      - LMS_CLI_PATH=/usr/local/bin/lms
      - VISION_UNLOAD_DELAY_SECONDS=${VISION_UNLOAD_DELAY_SECONDS:-300}
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
      - ./backend/app:/app/app
      - ${LMS_BIN_PATH:-./scripts/lms_server.py}:/usr/local/bin/lms:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app.celery_app inspect registered -t 5 -d worker-heavy-gpu-0@$$(hostname) 2>/dev/null | grep -q 'app.workers.tasks' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  worker-heavy-gpu-1:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    image: docu-intel-backend-gpu:latest
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q ocr_heavy --concurrency=${WORKER_HEAVY_GPU_CONCURRENCY:-1} --max-tasks-per-child=1 -n worker-heavy-gpu-1@%h
    restart: unless-stopped
    mem_limit: 8g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - WORKER_NAME=worker-heavy-gpu-1
      # Physical GPU 1 is reserved by deploy.resources; inside the
      # container it is always CUDA device 0.
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=1
      - LMS_SHIM_URL=http://host.docker.internal:1235
      - LMS_CLI_PATH=/usr/local/bin/lms
      - VISION_UNLOAD_DELAY_SECONDS=${VISION_UNLOAD_DELAY_SECONDS:-300}
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
      - ./backend/app:/app/app
      - ${LMS_BIN_PATH:-./scripts/lms_server.py}:/usr/local/bin/lms:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app.celery_app inspect registered -t 5 -d worker-heavy-gpu-1@$$(hostname) 2>/dev/null | grep -q 'app.workers.tasks' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  worker-maintenance:
    build:
      context: ./backend
    env_file: .env
    environment:
      - WORKER_NAME=worker-maintenance
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q maintenance --concurrency=${WORKER_MAINTENANCE_CONCURRENCY:-1} -n worker-maintenance@%h
    restart: unless-stopped
    # Entry point repairs nested bind-mount ownership, then runs as appuser.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
      - ./backend/app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d worker-maintenance@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  watcher:
    build:
      context: ./backend
    env_file: .env
    command: python -m app.ingestion.watcher
    restart: unless-stopped
    # Entry point repairs nested bind-mount ownership, then runs as appuser.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
      - ${SOURCE_CORPUS_DIR:?Set SOURCE_CORPUS_DIR in .env}:/app/source/2025:ro
      - ./backend/app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; assert os.path.isdir('/app/data/input')\""]
      interval: 30s
      timeout: 10s
      retries: 5

  scheduler:
    build:
      context: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    restart: unless-stopped
    # Entry point repairs nested bind-mount ownership, then runs as appuser.
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data/files:/app/data/files
      - ./data/input:/app/data/input
      - ./backend/app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        # VITE_* vars are baked into the bundle at build time; the
        # `environment:` block below is intentionally NOT used for
        # VITE_API_BASE_URL because it has no effect on an already
        # built Vite bundle. Default `/api/v1` (relative) relies on
        # the nginx proxy_pass to backend:8000 in frontend/nginx.conf.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.0}
        VITE_SENTRY_PROFILES_SAMPLE_RATE: ${VITE_SENTRY_PROFILES_SAMPLE_RATE:-0.0}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-}
    restart: unless-stopped
    environment:
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    ports:
      - "5173:80"
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

  # GlitchTip: Sentry-compatible error tracking. Opt-in via `--profile monitoring`.
  # After first start, log in (http://localhost:8001), create a project,
  # copy the DSN and set SENTRY_DSN in the backend .env (and VITE_SENTRY_DSN
  # in the frontend build args).
  glitchtip:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    # H-6: require an explicit strong SECRET_KEY and DB password. The
    # previous default ``change_me_generate_with_secrets_token_urlsafe_64``
    # is a well-known placeholder that ships in the public Docker image;
    # production operators who forgot to set the variable left the
    # GlitchTip UI unauthenticated against anyone on the network.
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD:?set GLITCHTIP_DB_PASSWORD in .env}@glitchtip-db/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY in .env}
      EMAIL_URL: ""
      GLITCHTIP_ENVIRONMENT: ${ENVIRONMENT:-local}
      ALLOWED_HOSTS: "*"
      ENABLE_SIGNUP: "true"
    # H-6: bind to loopback only by default; operators who need remote
    # access should put GlitchTip behind an authenticated reverse proxy.
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      glitchtip-db:
        condition: service_healthy
    profiles:
      - monitoring

  glitchtip-db:
    image: postgres:16-alpine
    restart: unless-stopped
    # H-6: require an explicit, strong GlitchTip DB password. The previous
    # default of ``glitchtip`` made every error event (which can include
    # stack traces with PII) trivially reachable by anyone on the
    # network. The compose ``config`` check rejects empty or known-weak
    # passwords; ``setup-env.ps1`` generates a secure one.
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?set GLITCHTIP_DB_PASSWORD in .env}
    volumes:
      - glitchtip_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - monitoring

volumes:
  postgres_data:
  glitchtip_data:
